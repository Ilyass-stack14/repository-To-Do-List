<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════
       HEADER
  ═══════════════════════════════════════ -->
  <header class="header">
    <div class="header-left">
      <p id="datetime" class="datetime"></p>
      <h1 id="greeting" class="greeting"></h1>
    </div>
    <div class="header-right">
      <button id="theme-toggle" class="btn-icon" aria-label="Toggle theme">
        <span id="theme-icon">🌙</span>
      </button>
      <button id="name-btn" class="btn-outline">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Set Name
      </button>
    </div>
  </header>

  <!-- ═══════════════════════════════════════
       MAIN DASHBOARD GRID
  ═══════════════════════════════════════ -->
  <main class="dashboard">

    <!-- ── FOCUS TIMER ── -->
    <section class="card timer-card" aria-label="Focus Timer">
      <div class="card-header">
        <span class="card-icon">⏱</span>
        <h2 class="card-title">Focus Timer</h2>
      </div>

      <div class="timer-ring-wrap">
        <svg class="timer-ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="ring-bg"       cx="60" cy="60" r="52" />
          <circle class="ring-progress" cx="60" cy="60" r="52" id="ring-progress" />
        </svg>
        <div class="timer-display" id="timer-display">25:00</div>
      </div>

      <div class="timer-controls">
        <button id="timer-start" class="btn-primary timer-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
          Start
        </button>
        <button id="timer-stop" class="btn-outline timer-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          Pause
        </button>
        <button id="timer-reset" class="btn-outline timer-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.95"/></svg>
          Reset
        </button>
      </div>

      <div class="timer-custom">
        <label for="custom-minutes">Duration (min)</label>
        <div class="timer-custom-row">
          <input id="custom-minutes" type="number" min="1" max="120" value="25" />
          <button id="timer-set" class="btn-primary">Set</button>
        </div>
      </div>
    </section>

    <!-- ── TO-DO LIST ── -->
    <section class="card todo-card" aria-label="To-Do List">
      <div class="card-header">
        <span class="card-icon">✅</span>
        <h2 class="card-title">To-Do List</h2>
        <span class="task-counter" id="task-counter"></span>
      </div>

      <div class="todo-input-row">
        <input id="todo-input" type="text" placeholder="Add a new task…" maxlength="100" autocomplete="off" />
        <button id="todo-add" class="btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add
        </button>
      </div>

      <div class="todo-toolbar">
        <div class="progress-bar-wrap" aria-label="Task progress">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="sort-row">
          <label for="sort-select">Sort</label>
          <select id="sort-select">
            <option value="default">Default</option>
            <option value="az">A → Z</option>
            <option value="za">Z → A</option>
            <option value="pending">Pending first</option>
            <option value="done">Done first</option>
          </select>
        </div>
      </div>

      <ul id="todo-list" class="todo-list" aria-label="Tasks"></ul>
    </section>

    <!-- ── QUICK LINKS ── -->
    <section class="card links-card" aria-label="Quick Links">
      <div class="card-header">
        <span class="card-icon">🔗</span>
        <h2 class="card-title">Quick Links</h2>
      </div>

      <div class="link-form">
        <input id="link-label" type="text"  placeholder="Label (e.g. YouTube)" maxlength="24" />
        <input id="link-url"   type="url"   placeholder="https://…" />
        <button id="link-add" class="btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add
        </button>
      </div>

      <div id="links-container" class="links-container"></div>
    </section>

  </main>

  <!-- ═══════════════════════════════════════
       MODALS
  ═══════════════════════════════════════ -->

  <!-- Edit task modal -->
  <div id="edit-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
    <div class="modal-box">
      <h2 id="edit-modal-title">Edit Task</h2>
      <input id="edit-input" type="text" maxlength="100" />
      <div class="modal-actions">
        <button id="edit-cancel" class="btn-outline">Cancel</button>
        <button id="edit-save"   class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <!-- Set name modal -->
  <div id="name-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="name-modal-title">
    <div class="modal-box">
      <h2 id="name-modal-title">What's your name?</h2>
      <p class="modal-hint">Your name appears in the greeting.</p>
      <input id="name-input" type="text" placeholder="Enter your name…" maxlength="30" />
      <div class="modal-actions">
        <button id="name-cancel" class="btn-outline">Cancel</button>
        <button id="name-save"   class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
